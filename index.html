<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower decision matrix" />
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details&quest;</a>
    </header>
    <main class="main">
      <section class="section">
        <h1 class="section__title section__title_margin">Add Item</h1>
        <div class="section__wrapper">
          <input class="section__input section__task section__input_width" id="new-task" type="text" />
          <button class="section__button" type="button">Add</button>
        </div>
      </section>
      <section class="section">
        <h2 class="section__title">Todo</h2>
        <ul class="section__list incomplete">
          <li class="section__item">
            <input class="section__checkbox" type="checkbox" />
            <label class="section__title-task section__task">Pay Bills</label>
            <input class="section__input section__task" type="text" />
            <button class="section__button edit" type="button">Edit</button>
            <button class="section__button delete" type="button">
              <img class="delete__icon" src="./remove.svg" alt="" />
            </button>
          </li>
          <li class="section__item edit-mode">
            <input class="section__checkbox" type="checkbox" />
            <label class="section__title-task section__task">Go Shopping</label>
            <input class="section__input section__task" type="text" value="Go Shopping" />
            <button class="section__button edit" type="button">Save</button>
            <button class="section__button delete" type="button">
              <img class="delete__icon" src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="section__title">Completed</h2>
        <ul class="section__list complete">
          <li class="section__item">
            <input class="section__checkbox" type="checkbox" checked />
            <label class="section__title-task section__task">See the Doctor</label>
            <input class="section__input section__task" type="text" />
            <button class="section__button edit" type="button">Edit</button>
            <button class="section__button delete" type="button">
              <img class="delete__icon" src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
